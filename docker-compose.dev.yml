services:
  web:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile

    container_name: compumercado-web-dev

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    
    stdin_open: true

    tty: true
    
    env_file:
      - .env.development

    environment:
      NODE_ENV: development    